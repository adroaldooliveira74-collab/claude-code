name: Pacote de Venda (venda-pericia)

# Monta o PACOTE COMERCIAL a cada atualização do programa:
#  - EXE do PC com a TRAVA DE LICENÇA ligada (licenca-config.js = true)
#  - APK do celular (app de campo)
#  - Manual de instalação (PDF)
# Resultado: artifact "venda-pericia" (venda-pericia.zip).
# NUNCA inclui o gerador de licenças (ferramentas/), que é só do vendedor.

on:
  workflow_dispatch:
  push:
    branches: [ main, "claude/zen-fermi-t4vuel" ]
    paths:
      - "index.html"
      - "assistencia.html"
      - "painel.html"
      - "admin.html"
      - "painel-controle.html"
      - "assinar.html"
      - "campo.html"
      - "comercial.js"
      - "licenca-config.js"
      - "venda-config.js"
      - "vendor/**"
      - "server/**"
      - "electron/**"
      - "Manual-de-Instalacao.html"
      - "package.json"
      - ".github/workflows/venda.yml"

jobs:
  exe:
    name: EXE comercial (Windows, com trava)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Ligar a trava de licença (versão comercial)
        run: Set-Content -Path licenca-config.js -Value 'window.VP_ENFORCE=true; /* pacote comercial */'
        shell: pwsh
      - name: Instalar dependências
        run: npm install
      - name: Compilar executável portátil
        run: npx electron-builder --win portable --publish never
        env:
          GH_TOKEN: ""
          # Assinatura de código (opcional): se você adicionar o certificado
          # nos Secrets do repositório, o .exe sai ASSINADO automaticamente e
          # some o aviso do Windows. Sem os secrets, compila normal (sem assinar).
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      - name: Renomear EXE
        run: Copy-Item (Get-ChildItem dist/*.exe | Select-Object -First 1).FullName -Destination "Perito-Laudo-PC.exe"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: venda-exe
          path: Perito-Laudo-PC.exe
          if-no-files-found: error

  apk:
    name: APK de campo (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Montar www (APK = app de campo)
        run: |
          mkdir -p www
          cp campo.html www/index.html
          cp manifest.webmanifest sw.js icon-192.png icon-512.png www/
      - name: Instalar Capacitor
        run: npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
      - name: Adicionar plataforma Android
        run: npx cap add android
      - name: Liberar HTTP local (cleartext)
        run: sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
      - name: Apontar SDK e aceitar licenças
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK" > android/local.properties
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - name: Sincronizar
        run: npx cap sync android
      - name: Compilar APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Perito-Campo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: venda-apk
          path: Perito-Campo.apk
          if-no-files-found: error

  pacote:
    name: Montar venda-pericia.zip
    needs: [exe, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar manual em PDF
        run: |
          npm install --no-save playwright-core@1.47.2 >/dev/null 2>&1 || true
          npx --yes playwright-core@1.47.2 install chromium >/dev/null 2>&1 || true
          node -e "const{chromium}=require('playwright-core');(async()=>{const b=await chromium.launch();const p=await b.newPage();await p.goto('file://'+process.cwd()+'/Manual-de-Instalacao.html',{waitUntil:'networkidle'});await p.pdf({path:'Manual-de-Instalacao.pdf',format:'A4',printBackground:true,margin:{top:'12mm',bottom:'14mm',left:'10mm',right:'10mm'}});await b.close();})().catch(e=>{console.error(e);process.exit(0);});" || echo "PDF: usando o do repositório"
      - uses: actions/download-artifact@v4
        with: { name: venda-exe, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: venda-apk, path: dl }
      - name: Montar pasta e zipar
        run: |
          rm -rf venda-pericia && mkdir -p venda-pericia
          cp dl/Perito-Laudo-PC.exe venda-pericia/
          cp dl/Perito-Campo.apk venda-pericia/
          cp Manual-de-Instalacao.pdf venda-pericia/ 2>/dev/null || cp Manual-de-Instalacao.html venda-pericia/
          cat > venda-pericia/LEIA-ME.txt <<'TXT'
          Perito · Laudo — Pacote de instalacao
          ======================================
          1) No computador: abra "Perito-Laudo-PC.exe" (dois cliques).
          2) No celular/tablet: instale "Perito-Campo.apk".
          3) Leia o "Manual-de-Instalacao.pdf" (instalacao, licenca, marca e sincronizacao).

          Ativacao: abra o programa > Painel de Controle > cole o codigo de liberacao (12 meses).
          Sem licenca valida, o programa funciona em modo consulta (somente leitura).
          TXT
          zip -r venda-pericia.zip venda-pericia >/dev/null
          ls -la venda-pericia.zip
      - uses: actions/upload-artifact@v4
        with:
          name: venda-pericia
          path: venda-pericia.zip
          if-no-files-found: error
